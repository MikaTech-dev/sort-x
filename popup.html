<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort X</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <svg class="popup-logo" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D9BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 16 4 4 4-4"/>
        <path d="M7 20V4"/>
        <path d="M11 4h10"/>
        <path d="M11 8h7"/>
        <path d="M11 12h4"/>
      </svg>
      <div>
        <h1>Sort X</h1>
        <span class="popup-version">v1.0.0</span>
      </div>
    </header>

    <p class="popup-desc">
      Sort any X profile's <strong>Followers</strong> or <strong>Following</strong>
      list by follower count.
    </p>

    <div class="popup-steps">
      <h2>How to use</h2>
      <ol>
        <li>Go to a profile's <strong>Followers</strong> or <strong>Following</strong> page</li>
        <li>Click <strong>⬇</strong> to auto-scroll and load all users</li>
        <li>Click <strong>Sort</strong> to see the ranked list</li>
      </ol>
    </div>

    <footer class="popup-footer">
      <a href="https://github.com/MikaTech-dev/sort-twt-followers" target="_blank" rel="noopener">
        GitHub
      </a>
    </footer>
  </div>
</body>
</html>
